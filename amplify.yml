version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Best-effort LFS pull for remaining product .mp4 assets. Do NOT fail the
        # build if LFS auth is unavailable — landing/podcast videos under
        # public/videos are regular Git blobs and must still deploy.
        - |
          if ! command -v git-lfs >/dev/null 2>&1; then
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.rpm.sh | bash || true
            yum install -y git-lfs || true
          fi
        - git lfs install || true
        - GIT_LFS_SKIP_SMUDGE=0 git lfs pull || echo "WARN: git lfs pull failed; continuing"
        - |
          echo "=== public/videos sizes (must be real MP4s, not LFS pointers) ==="
          ls -la public/videos || true
          for f in public/videos/*.mp4; do
            [ -f "$f" ] || continue
            if head -c 80 "$f" | grep -q "git-lfs.github.com"; then
              echo "ERROR: $f is still a Git LFS pointer — aborting build"
              exit 1
            fi
            echo "OK video blob: $f ($(wc -c < "$f") bytes)"
          done
        - nvm use 20
        - npm install -g pnpm@9.15.4
        - pnpm install --frozen-lockfile
        - rm -f .env.production
        - |
          cat > .env.production <<EOF
          REGION=$REGION
          AWS_REGION=$AWS_REGION
          ACCESS_KEY_ID=$ACCESS_KEY_ID
          SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          SES_SOURCE_EMAIL=$SES_SOURCE_EMAIL
          SENDER_EMAIL=$SENDER_EMAIL
          SES_RECIPIENT_CONTACT=$SES_RECIPIENT_CONTACT
          SES_RECIPIENT_CASESTUDY=$SES_RECIPIENT_CASESTUDY
          SES_RECIPIENT_CAREERS_US=$SES_RECIPIENT_CAREERS_US
          SES_RECIPIENT_CAREERS_NONUS=$SES_RECIPIENT_CAREERS_NONUS
          EOF
    build:
      commands:
        - pnpm run build
        # Ensure public assets (videos) are present next to the Next.js output
        # for Amplify Hosting SSR packaging.
        - |
          if [ -d public ] && [ -d .next ]; then
            mkdir -p .next/standalone/public 2>/dev/null || true
            cp -R public/. .next/standalone/public/ 2>/dev/null || true
            echo "public/videos after build:"
            ls -la public/videos || true
          fi
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*