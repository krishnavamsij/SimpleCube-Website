<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #020918; color: white; display: flex; gap: 20px; padding: 50px; font-family: sans-serif; flex-wrap: wrap; }
  .card { width: 300px; height: 225px; background: #050b16; border-radius: 12px; overflow: hidden; position: relative; }
  .img { width: 100%; height: 100%; object-fit: cover; }
  
  .madhu1 { transform: scale(1.3) translateY(-2%); object-position: center 15%; }
  .madhu2 { transform: scale(1.3) translateY(0%); object-position: top; }
  .madhu3 { transform: scale(1.2) translateY(5%); object-position: top; }
  .madhu4 { transform: scale(1.25) translateY(8%); object-position: top; transform-origin: top center; }

</style>
</head>
<body>

<div class="card">
  <h3>Madhu 1 (Current)</h3>
  <img src="/images/leadership images/Madhu Bandarapu.png" class="img madhu1">
</div>

<div class="card">
  <h3>Madhu 2</h3>
  <img src="/images/leadership images/Madhu Bandarapu.png" class="img madhu2">
</div>

<div class="card">
  <h3>Madhu 3</h3>
  <img src="/images/leadership images/Madhu Bandarapu.png" class="img madhu3">
</div>

<div class="card">
  <h3>Madhu 4</h3>
  <img src="/images/leadership images/Madhu Bandarapu.png" class="img madhu4">
</div>

</body>
</html>
