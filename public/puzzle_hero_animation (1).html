<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Puzzle - Premium Hero Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #0a0e27;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
        }

        /* Debug timeline (remove in production) */
        .debug-timeline {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            color: #60a5fa;
            padding: 12px 16px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .phase-label {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="debug-timeline">
            <div>Timeline:</div>
            <div>0–2s: <span class="phase-label">CLUSTER</span></div>
            <div>2–5s: <span class="phase-label">CONVERGENCE</span></div>
            <div>5–6s: <span class="phase-label">LOCK</span></div>
            <div>6s+: <span class="phase-label">STABLE</span></div>
            <hr style="margin: 8px 0; border: none; border-top: 1px solid rgba(96, 165, 250, 0.3);">
            <div id="current-phase" style="color: #f472b6;">Phase: —</div>
            <div id="timeline-elapsed" style="color: #fbbf24;">Time: 0.0s</div>
        </div>
    </div>

    <script>
        // ===================================
        // STRICT CONFIGURATION
        // ===================================
        const CONFIG = {
            // Timeline (in milliseconds)
            CLUSTER_DURATION: 2000,        // 0–2s: Initial cluster state
            CONVERGENCE_DURATION: 3500,    // 2–5.5s: Magnetic pull with acceleration
            LOCK_DURATION: 700,            // 5.5–6.2s: Individual cube lock moments
            
            // Cube configuration
            CUBE_COUNT: 8,                 // 8 cubes for perfect 2x2x2
            CUBE_SIZE: 0.85,               // Individual cube size
            CUBE_SPACING: 1.0,             // Perfect 2x2x2 spacing
            
            // Initial cluster positioning (right-side composition)
            CLUSTER_RADIUS: 2.4,           // How spread (increased for depth)
            CLUSTER_CENTER: { x: 2.2, y: 0, z: -0.5 }, // Shifted RIGHT + BACK
            
            // Convergence behavior
            CENTER_POINT: { x: 1.9, y: 0, z: 0 }, // Formation center (right-offset)
            STAGGER_DELAY: 220,            // Delay between cube starts (ms)
            ACCELERATION_CURVE: 'easeInOutQuart', // Smooth acceleration
            
            // Lock behavior (per-cube with individual timing)
            BOUNCE_STRENGTH: 0.20,         // Overshoot factor (enhanced)
            LOCK_STAGGER: 100,             // Delay between each cube lock (ms)
            LOCK_EASE: 'easeOutElastic',   // Satisfying bounce
            
            // Lighting colors (enhanced intensity)
            PRIMARY_GLOW: 0xb88ef7,        // Bright purple
            SECONDARY_GLOW: 0x7dd3fc,      // Bright cyan
            TERTIARY_GLOW: 0xf472b6,       // Pink
            
            // Camera (tilted, right-side framing)
            CAMERA_DISTANCE: 7.5,
            CAMERA_TILT: 0.38,             // Radians, cinematic angle
            CAMERA_SIDE: 0.9,              // Right offset
        };

        // ===================================
        // GLOBAL STATE
        // ===================================
        let scene, camera, renderer;
        let cubes = [];
        let globalStartTime = 0;
        let currentPhase = 'cluster';

        // ===================================
        // INITIALIZATION
        // ===================================
        function init() {
            initScene();
            initLighting();
            createCubes();
            globalStartTime = Date.now();
            animate();
            console.log('🎬 Puzzle Hero Animation Started - Strict Timeline');
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = null;
            scene.fog = new THREE.Fog(0x0a0e27, 20, 32);

            // Cinematic camera (tilted, right-side composition)
            camera = new THREE.PerspectiveCamera(
                48,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            
            // Position: tilted angle + side offset for composition
            camera.position.set(
                Math.sin(CONFIG.CAMERA_TILT) * CONFIG.CAMERA_DISTANCE + CONFIG.CAMERA_SIDE,
                Math.cos(CONFIG.CAMERA_TILT) * CONFIG.CAMERA_DISTANCE * 0.65,
                CONFIG.CAMERA_DISTANCE * 1.3
            );
            camera.lookAt(CONFIG.CENTER_POINT.x, CONFIG.CENTER_POINT.y, CONFIG.CENTER_POINT.z);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
                precision: 'highp'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        function initLighting() {
            // Key light (dramatic, from upper right) - INCREASED INTENSITY
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
            keyLight.position.set(9, 6, 7);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 55;
            keyLight.shadow.camera.left = -14;
            keyLight.shadow.camera.right = 14;
            keyLight.shadow.camera.top = 14;
            keyLight.shadow.camera.bottom = -14;
            scene.add(keyLight);

            // Rim light 1 (purple, from left) - STRONGER
            const rimLight1 = new THREE.PointLight(CONFIG.PRIMARY_GLOW, 0.85);
            rimLight1.position.set(-6.5, 4, 3);
            scene.add(rimLight1);

            // Rim light 2 (blue, from back) - NEW
            const rimLight2 = new THREE.PointLight(CONFIG.SECONDARY_GLOW, 0.7);
            rimLight2.position.set(3, 5, -7);
            scene.add(rimLight2);

            // Fill light (blue, from right-back) - BRIGHTER
            const fillLight = new THREE.PointLight(CONFIG.SECONDARY_GLOW, 0.65);
            fillLight.position.set(7, -3, -5);
            scene.add(fillLight);

            // Ambient (very subtle for contrast)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
            scene.add(ambientLight);
        }

        // ===================================
        // CUBE CREATION (Premium Materials)
        // ===================================
        function createCubes() {
            for (let i = 0; i < CONFIG.CUBE_COUNT; i++) {
                const cube = createSingleCube();
                scene.add(cube);
                cubes.push(cube);
            }

            // Position initial cluster (misaligned, scattered)
            positionInitialCluster();
            
            // Pre-calculate final 2x2x2 formation
            calculateFinalFormation();
        }

        function createSingleCube() {
            const geometry = new THREE.BoxGeometry(
                CONFIG.CUBE_SIZE,
                CONFIG.CUBE_SIZE,
                CONFIG.CUBE_SIZE
            );

            // Metallic + glass hybrid (premium finish)
            const material = new THREE.MeshStandardMaterial({
                color: 0x1f3a5f,           // Darker base (more contrast)
                metalness: 0.8,            // More metallic (was 0.65)
                roughness: 0.15,           // Less rough (sharper reflections)
                transparent: true,
                opacity: 0.92,             // Slightly more opaque
                envMapIntensity: 1.5,      // More reflective
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Stronger neon rim glow (using emissive layer)
            const glowGeometry = new THREE.BoxGeometry(
                CONFIG.CUBE_SIZE * 1.018,
                CONFIG.CUBE_SIZE * 1.018,
                CONFIG.CUBE_SIZE * 1.018
            );
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: CONFIG.PRIMARY_GLOW,
                transparent: true,
                opacity: 0.15,             // Enhanced opacity
                side: THREE.BackSide,
            });
            const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            mesh.add(glowMesh);

            mesh.userData = {
                initialPos: new THREE.Vector3(),
                finalPos: new THREE.Vector3(),
                initialRot: new THREE.Euler(),
                curveControlPoint: new THREE.Vector3(), // For curved paths
                glowMesh: glowMesh,
                index: cubes.length,
                lockStartTime: null,       // For per-cube lock timing
            };

            return mesh;
        }

        function positionInitialCluster() {
            // Create a tight, misaligned cluster of cubes
            cubes.forEach((cube, index) => {
                // Random positions within cluster radius (using cluster center)
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * CONFIG.CLUSTER_RADIUS;
                const height = (Math.random() - 0.5) * 1.5;
                const depth = (Math.random() - 0.5) * 1.8;

                const x = CONFIG.CLUSTER_CENTER.x + Math.cos(angle) * radius;
                const y = CONFIG.CLUSTER_CENTER.y + height;
                const z = CONFIG.CLUSTER_CENTER.z + depth;

                cube.position.set(x, y, z);
                cube.userData.initialPos.copy(cube.position);

                // Random rotations (misaligned, chaotic feel)
                const rx = Math.random() * Math.PI * 0.9;
                const ry = Math.random() * Math.PI * 0.9;
                const rz = Math.random() * Math.PI * 0.9;
                cube.rotation.set(rx, ry, rz);
                cube.userData.initialRot.copy(cube.rotation);

                // Minimal idle motion (very subtle)
                cube.userData.idleOffsetX = Math.random() * 0.06;
                cube.userData.idleOffsetY = Math.random() * 0.06;
                cube.userData.idleOffsetZ = Math.random() * 0.06;

                // Calculate curve control point (for non-linear convergence path)
                // Push outward first, then curve inward (creates "slingshot" effect)
                const angle2D = Math.atan2(cube.userData.initialPos.z - CONFIG.CENTER_POINT.z, 
                                           cube.userData.initialPos.x - CONFIG.CENTER_POINT.x);
                const controlDist = 1.8;
                cube.userData.curveControlPoint.set(
                    CONFIG.CENTER_POINT.x + Math.cos(angle2D) * controlDist,
                    CONFIG.CENTER_POINT.y + (Math.random() - 0.5) * 1.0,
                    CONFIG.CENTER_POINT.z + Math.sin(angle2D) * controlDist
                );
            });
        }

        function calculateFinalFormation() {
            // Perfect 2x2x2 cube formation
            // Arrange 8 cubes in grid
            const positions = [];
            const spacing = CONFIG.CUBE_SPACING;
            
            for (let x = 0; x < 2; x++) {
                for (let y = 0; y < 2; y++) {
                    for (let z = 0; z < 2; z++) {
                        positions.push({
                            x: CONFIG.CENTER_POINT.x + (x - 0.5) * spacing,
                            y: CONFIG.CENTER_POINT.y + (y - 0.5) * spacing,
                            z: CONFIG.CENTER_POINT.z + (z - 0.5) * spacing,
                        });
                    }
                }
            }

            // Shuffle for organic assignment
            positions.sort(() => Math.random() - 0.5);

            cubes.forEach((cube, index) => {
                cube.userData.finalPos.set(
                    positions[index].x,
                    positions[index].y,
                    positions[index].z
                );
            });
        }

        // ===================================
        // ANIMATION LOOP - STRICT PHASES
        // ===================================
        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - globalStartTime;
            const elapsedSeconds = elapsed / 1000;

            // Update debug display
            updateDebugDisplay(elapsedSeconds);

            // Determine current phase
            if (elapsed < CONFIG.CLUSTER_DURATION) {
                currentPhase = 'cluster';
                updateClusterPhase(elapsed);
            } else if (elapsed < CONFIG.CLUSTER_DURATION + CONFIG.CONVERGENCE_DURATION) {
                currentPhase = 'convergence';
                const convergeElapsed = elapsed - CONFIG.CLUSTER_DURATION;
                updateConvergencePhase(convergeElapsed);
            } else if (elapsed < CONFIG.CLUSTER_DURATION + CONFIG.CONVERGENCE_DURATION + CONFIG.LOCK_DURATION) {
                currentPhase = 'lock';
                const lockElapsed = elapsed - (CONFIG.CLUSTER_DURATION + CONFIG.CONVERGENCE_DURATION);
                updateLockPhase(lockElapsed);
            } else {
                currentPhase = 'stable';
                updateStablePhase(elapsed);
            }

            renderer.render(scene, camera);
        }

        // ===================================
        // PHASE 1: CLUSTER (0–2s)
        // ===================================
        function updateClusterPhase(elapsed) {
            const progress = elapsed / CONFIG.CLUSTER_DURATION;

            cubes.forEach((cube) => {
                // Barely moving — almost still
                // Very subtle breathing motion
                const breathe = Math.sin((elapsed / 1000) * 0.5) * 0.02;
                
                cube.position.set(
                    cube.userData.initialPos.x + Math.sin(elapsed * 0.0008 + cube.userData.idleOffsetX) * 0.04,
                    cube.userData.initialPos.y + Math.cos(elapsed * 0.0006 + cube.userData.idleOffsetY) * 0.04 + breathe,
                    cube.userData.initialPos.z + Math.sin(elapsed * 0.0007 + cube.userData.idleOffsetZ) * 0.03
                );

                // Maintain initial misaligned rotation
                cube.rotation.copy(cube.userData.initialRot);

                // Glow stays dim
                cube.userData.glowMesh.material.opacity = 0.08;
            });
        }

        // ===================================
        // PHASE 2: CONVERGENCE (2–5.5s) - WITH CURVED PATHS & ACCELERATION
        // ===================================
        function updateConvergencePhase(elapsed) {
            cubes.forEach((cube, index) => {
                // Staggered start: each cube begins moving with delay
                const staggerDelay = CONFIG.STAGGER_DELAY * index;
                const staggeredElapsed = Math.max(0, elapsed - staggerDelay);
                const staggeredProgress = Math.min(staggeredElapsed / CONFIG.CONVERGENCE_DURATION, 1);

                if (staggeredProgress > 0 && staggeredProgress < 1) {
                    // Smooth acceleration: slow → fast → settle
                    const eased = getEasing(CONFIG.ACCELERATION_CURVE)(staggeredProgress);

                    // CURVED PATH using quadratic bezier interpolation
                    // Start → Control Point (outward curve) → Final (inward curve)
                    const posA = cube.userData.initialPos;
                    const posB = cube.userData.curveControlPoint;
                    const posC = cube.userData.finalPos;

                    // Quadratic bezier: P(t) = (1-t)²P0 + 2(1-t)tP1 + t²P2
                    const t = eased;
                    const mt = 1 - t;
                    const mt2 = mt * mt;
                    const t2 = t * t;
                    const tmt2 = 2 * t * mt;

                    cube.position.x = mt2 * posA.x + tmt2 * posB.x + t2 * posC.x;
                    cube.position.y = mt2 * posA.y + tmt2 * posB.y + t2 * posC.y;
                    cube.position.z = mt2 * posA.z + tmt2 * posB.z + t2 * posC.z;

                    // Gradual rotation toward alignment (0, 0, 0)
                    cube.rotation.x = cube.userData.initialRot.x * (1 - eased);
                    cube.rotation.y = cube.userData.initialRot.y * (1 - eased);
                    cube.rotation.z = cube.userData.initialRot.z * (1 - eased);

                    // Glow intensifies as convergence progresses
                    cube.userData.glowMesh.material.opacity = 0.12 + eased * 0.12;
                } else if (staggeredProgress >= 1) {
                    // Converged: hold final position
                    cube.position.copy(cube.userData.finalPos);
                    cube.rotation.set(0, 0, 0);
                    cube.userData.glowMesh.material.opacity = 0.24;
                }
            });
        }

        // ===================================
        // PHASE 3: LOCK (5.5–6.2s) - INDIVIDUAL CUBE LOCK MOMENTS
        // ===================================
        function updateLockPhase(elapsed) {
            cubes.forEach((cube, index) => {
                // Each cube locks at slightly different time (staggered)
                const lockStartDelay = CONFIG.LOCK_STAGGER * index;
                const lockElapsed = elapsed - lockStartDelay;
                const lockProgress = Math.max(0, Math.min(lockElapsed / CONFIG.LOCK_DURATION, 1));

                if (lockProgress > 0 && lockProgress < 1) {
                    // Elastic bounce: creates satisfying "snap & settle" moment
                    const bounceEasing = getEasing(CONFIG.LOCK_EASE)(lockProgress);

                    // Apply bounce with overshoot
                    const overshootAmount = Math.sin(lockProgress * Math.PI) * CONFIG.BOUNCE_STRENGTH;
                    
                    cube.position.copy(cube.userData.finalPos);
                    // Add slight overshoot on y-axis
                    cube.position.y += overshootAmount * 0.25;
                    
                    // Add tiny rotational "snap" during lock
                    const snapRotation = Math.sin(lockProgress * Math.PI * 2) * 0.02;
                    cube.rotation.set(snapRotation * 0.1, snapRotation * 0.15, snapRotation * 0.05);

                    // Glow pulses intensely during lock
                    const lockGlow = 0.22 + Math.sin(lockElapsed * 0.025) * 0.12;
                    cube.userData.glowMesh.material.opacity = lockGlow;
                } else if (lockProgress >= 1) {
                    // LOCKED: No movement, no drift
                    cube.position.copy(cube.userData.finalPos);
                    cube.rotation.set(0, 0, 0);
                    
                    // Subtle glow pulse only (no motion)
                    const stablePulse = 0.18 + Math.sin(elapsed * 0.003) * 0.06;
                    cube.userData.glowMesh.material.opacity = stablePulse;
                }
            });
        }

        // ===================================
        // PHASE 4: STABLE (6.2s+) - COMPLETELY STOPPED
        // ===================================
        function updateStablePhase(elapsed) {
            // No movement whatsoever. Cubes locked in perfect 2x2x2 formation.
            cubes.forEach((cube) => {
                cube.position.copy(cube.userData.finalPos);
                cube.rotation.set(0, 0, 0);

                // ONLY subtle glow pulse (no position changes)
                const glowPulse = 0.16 + Math.sin(elapsed * 0.0025) * 0.08;
                cube.userData.glowMesh.material.opacity = glowPulse;
            });
        }

        // ===================================
        // EASING FUNCTIONS
        // ===================================
        function getEasing(easeName) {
            const easing = {
                linear: (t) => t,
                
                easeInOutQuart: (t) => {
                    return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
                },
                
                easeInOutCubic: (t) => {
                    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                },
                
                easeOutElastic: (t) => {
                    const c5 = (2 * Math.PI) / 4.5;
                    return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c5) + 1;
                },
                
                easeOutQuad: (t) => {
                    return 1 - (1 - t) * (1 - t);
                },
            };
            
            return easing[easeName] || easing.linear;
        }

        // ===================================
        // DEBUG & UTILITIES
        // ===================================
        function updateDebugDisplay(seconds) {
            const phaseEl = document.getElementById('current-phase');
            const timeEl = document.getElementById('timeline-elapsed');

            let phaseText = '';
            if (currentPhase === 'cluster') phaseText = '📦 CLUSTER (0–2s)';
            else if (currentPhase === 'convergence') phaseText = '🧲 CONVERGENCE (2–5.5s)';
            else if (currentPhase === 'lock') phaseText = '🔒 LOCK (5.5–6.2s)';
            else if (currentPhase === 'stable') phaseText = '✨ STABLE (6.2s+)';

            phaseEl.textContent = `Phase: ${phaseText}`;
            timeEl.textContent = `Time: ${seconds.toFixed(1)}s`;
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // ===================================
        // START
        // ===================================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
