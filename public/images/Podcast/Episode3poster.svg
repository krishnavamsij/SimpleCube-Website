<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="#030B3B"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#030B3B;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  
  <!-- CU NEXT Logo Text -->
  <text x="960" y="400" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#00D4AA" text-anchor="middle">CU NEXT</text>
  
  <!-- Episode Title -->
  <text x="960" y="550" font-family="Arial, sans-serif" font-size="56" font-weight="600" fill="#FFFFFF" text-anchor="middle">Don't Put No in Innovation</text>
  
  <!-- Episode Number -->
  <text x="960" y="650" font-family="Arial, sans-serif" font-size="40" fill="#1e90ff" text-anchor="middle">Episode #03</text>
  
  <!-- Guest Info -->
  <text x="960" y="750" font-family="Arial, sans-serif" font-size="36" fill="#E5E7EB" text-anchor="middle">Guest: Rickey Burks</text>
  
  <!-- Duration & Date -->
  <text x="960" y="850" font-family="Arial, sans-serif" font-size="28" fill="#9CA3AF" text-anchor="middle">36 minutes • 1st July 2026</text>
  
  <!-- Temporary Placeholder Note -->
  <text x="960" y="980" font-family="Arial, sans-serif" font-size="24" fill="#6B7280" text-anchor="middle" font-style="italic">Temporary Placeholder - Replace with actual image</text>
</svg>
