<!--
  SimpleCube brand mark (cube-in-circle)
  Primary fill: #135498 (BrandBoard primary)
  Cube faces: #FFFFFF
  Use for favicon, app icon, and compact UI marks.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SimpleCube">
  <circle cx="32" cy="32" r="32" fill="#135498"/>
  <!-- Isometric cube: top / left / right faces -->
  <g fill="#FFFFFF" stroke="#135498" stroke-width="1.25" stroke-linejoin="round">
    <polygon points="32,16 46,24 32,32 18,24"/>
    <polygon points="18,24 32,32 32,46 18,38"/>
    <polygon points="32,32 46,24 46,38 32,46"/>
  </g>
</svg>
